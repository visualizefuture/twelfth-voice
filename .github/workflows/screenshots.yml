name: Screenshots

# Runs the whole app (API serving the built Angular app, in-memory storage, no Azure) and
# captures screenshots with Playwright. Download them from the run's artifacts.
on:
  workflow_dispatch:
  push:
    branches: ['feature/**']
    paths: ['web/**', 'tools/screenshots/**', '.github/workflows/screenshots.yml']

# Write access only to push the screenshots to the ci-screenshots branch (easy to browse and pull).
permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the fan app
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx ng build
          mkdir -p ../src/TwelfthVoice.Api/wwwroot
          cp -r dist/*/browser/. ../src/TwelfthVoice.Api/wwwroot/

      - name: Start the API
        env:
          Storage__Provider: InMemory
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          dotnet build src/TwelfthVoice.Api -c Release
          nohup dotnet run --project src/TwelfthVoice.Api -c Release --no-build --no-launch-profile --urls http://localhost:5080 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health && break; sleep 2; done

      - name: Take screenshots
        working-directory: tools/screenshots
        run: |
          mkdir -p "$OUT_DIR"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.56.1 2>&1 | tail -n 5 | tee "$OUT_DIR/install.log"
          npx playwright install --with-deps chromium > "$OUT_DIR/browser-install.log" 2>&1
          node shoot.mjs 2>&1 | tee "$OUT_DIR/shoot.log"
          exit ${PIPESTATUS[0]}
        env:
          OUT_DIR: ${{ github.workspace }}/screenshots

      - name: API log
        if: always()
        run: |
          tail -n 80 api.log || true
          mkdir -p screenshots && cp api.log screenshots/ || true

      - name: Publish to the ci-screenshots branch
        if: always()
        working-directory: screenshots
        run: |
          git init -q
          git checkout -q -b screens
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screens:ci-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
