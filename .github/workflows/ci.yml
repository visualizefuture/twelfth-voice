name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TwelfthVoice.sln

      - name: Build
        run: dotnet build TwelfthVoice.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test TwelfthVoice.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Check for vulnerable packages
        run: |
          dotnet list TwelfthVoice.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qE "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see the list above)."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  web:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Uses npm ci once a package-lock.json is committed; falls back to npm install until then.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Check for vulnerable packages
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  container:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (no push)
        run: docker build -t twelfth-voice:ci .
      - name: Start it and check health
        run: |
          docker run -d --name tv -p 8080:8080 -e Storage__Provider=InMemory twelfth-voice:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 2; done
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8080/ | grep -q "<tv-root>" && echo "fan app served"
          curl -sf http://localhost:8080/api/teams | head -c 200; echo
      - name: Container log
        if: always()
        run: docker logs tv || true

