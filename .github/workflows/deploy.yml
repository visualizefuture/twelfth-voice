name: Deploy to Azure

# Builds the container and rolls it out to Azure Container Apps on every merge to master.
# Signs in with OpenID Connect (deploy/azure-setup.sh creates the trust), so no Azure secret is stored.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'tools/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-twelfth-voice
  APP_NAME: twelfth-voice
  IMAGE_NAME: twelfth-voice

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # No GitHub "environment" here: it would change the OIDC subject the Azure trust expects.
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find the container registry
        id: acr
        run: |
          acr=$(az acr list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          echo "name=$acr" >> "$GITHUB_OUTPUT"
          echo "server=$(az acr show -n "$acr" --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        run: |
          az acr login -n "${{ steps.acr.outputs.name }}"
          image="${{ steps.acr.outputs.server }}/$IMAGE_NAME:${GITHUB_SHA::12}"
          docker build -t "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Roll out
        id: rollout
        run: |
          az extension add -n containerapp --upgrade -y --only-show-errors
          az containerapp ingress update -n "$APP_NAME" -g "$RESOURCE_GROUP" --target-port 8080 -o none
          az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" --image "$IMAGE" -o none
          fqdn=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          url="${{ steps.rollout.outputs.url }}"
          for i in $(seq 1 30); do
            if curl -sf "$url/health" > /dev/null; then
              echo "Healthy: $url"
              curl -s "$url/api/status" | head -c 1200; echo
              exit 0
            fi
            sleep 10
          done
          echo "::error::The app didn't become healthy at $url"
          exit 1
